name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:        # lets you run it manually to test

permissions: {}             # least-privilege
concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          URL="https://vgcpokemonstats.streamlit.app/"
          echo "Pinging $URL at $(date -u)"
          # GET the page; don't fail the job if it times out
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
          echo "HTTP status: $CODE"
          # Optional: treat only 5xx as noteworthy but still succeed
          if [ "${CODE:-000}" -ge 500 ]; then
            echo "Server error (but keeping job green)."
          fi
